name: Release Validation

on:
    # Keep original triggers for pull requests
    pull_request:
        branches: [main]
    # Trigger after CI workflow completes successfully on main branch
    workflow_run:
        workflows: ["CI"]
        types:
            - completed
        branches:
            - main

jobs:
    multiple_db_check:
        name: Test with multiple databases
        runs-on: ubuntu-latest
        # Only run if CI workflow was successful (for workflow_run trigger)
        # For pull_request trigger, this condition will be true by default
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
        env:
            TEST_SECRET_KEY: ASD123klj+aAddSadadadadafafsaggsdfsfdasf
            TEST_ADMIN_USER: hello
            TEST_ADMIN_PASSWORD: world
            POSTGRES_PASSWORD: lmsctl2
            MYSQL_ROOT_PASSWORD: root
            MYSQL_PASSWORD: lmsctl
        steps:
            - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.7
              with:
                ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            - name: Set up Python 3
              uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v4.6.0
              with:
                  python-version: 3.12 # Keep in sync in the python version in the Dockerfile
            - name: Install python package
              env:
                  CI: True
                  LOG_LEVEL: TRACE
              run: |
                  python -m pip install --require-hashes -r test.lock
            - name: Test with SQLite
              env:
                  CI: True
                  SECRET_KEY: ${{ env.TEST_SECRET_KEY }}
                  LOG_LEVEL: TRACE
              run: |
                  pybabel compile -d now_lms/translations
                  pytest --cov=now_lms
            - name: Test with Postgresql + pg8000
              env:
                  CI: True
                  SECRET_KEY: ${{ env.TEST_SECRET_KEY }}
                  DATABASE_URL: postgresql+pg8000://lmsctl2:${{ env.POSTGRES_PASSWORD }}@127.0.0.1:5432/lmsctl2
                  ADMIN_USER: ${{ env.TEST_ADMIN_USER }}
                  ADMIN_PSWD: ${{ env.TEST_ADMIN_PASSWORD }}
                  FLASK_APP: now_lms
                  LOG_LEVEL: TRACE
              run: |
                  sudo systemctl start postgresql.service
                  sudo -u postgres psql -c "CREATE USER lmsctl2 WITH PASSWORD '${{ env.POSTGRES_PASSWORD }}';"
                  sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON SCHEMA public TO lmsctl2;"
                  sudo -u postgres psql -c "CREATE DATABASE lmsctl2;"
                  sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE lmsctl2 TO lmsctl2;"
                  sudo -u postgres psql -c "ALTER DATABASE lmsctl2 OWNER TO lmsctl2;"
                  sudo -u postgres psql -c "ALTER ROLE lmsctl2 CREATEDB;"
                  sudo -u postgres psql -c "GRANT USAGE ON SCHEMA public TO lmsctl2;"
                  sudo -u postgres psql -c "GRANT CREATE ON SCHEMA public TO lmsctl2;"
                  pytest  -v -v  --cov=now_lms --cov-append tests/test_multipledb.py
                  pytest  -v -v  --cov=now_lms --cov-append tests/test_alembic_upgrade.py
            - name: Test with MySQL
              env:
                  CI: True
                  SECRET_KEY: ${{ env.TEST_SECRET_KEY }}
                  DATABASE_URL: mysql+mysqlconnector://lmsctl:${{ env.MYSQL_PASSWORD }}@127.0.0.1/lmsctl
                  ADMIN_USER: ${{ env.TEST_ADMIN_USER }}
                  ADMIN_PSWD: ${{ env.TEST_ADMIN_PASSWORD }}
                  FLASK_APP: now_lms
                  LOG_LEVEL: TRACE
              run: |
                  sudo systemctl start mysql.service
                  mysql -u root -p"${{ env.MYSQL_ROOT_PASSWORD }}" -e "CREATE USER 'lmsctl'@'localhost' IDENTIFIED BY '${{ env.MYSQL_PASSWORD }}';"
                  mysql -u root -p"${{ env.MYSQL_ROOT_PASSWORD }}" -e "CREATE DATABASE lmsctl;"
                  mysql -u root -p"${{ env.MYSQL_ROOT_PASSWORD }}" -e "GRANT ALL PRIVILEGES ON lmsctl.* TO 'lmsctl'@'localhost'; FLUSH PRIVILEGES;"
                  pytest -v -v --cov=now_lms --cov-append tests/test_multipledb.py
                  pytest  -v -v  --cov=now_lms --cov-append tests/test_alembic_upgrade.py
            - name: Linting
              run: |
                  flake8 --max-line-length=120 --ignore=E501,E203,E266,W503,E722 now_lms
                  mypy now_lms --install-types --non-interactive --ignore-missing-imports
                  ruff check now_lms
                  pylint now_lms --score=yes --fail-under=9
            - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  fail_ci_if_error: true # optional (default = false)
                  #files: ./coverage1.xml,./coverage2.xml # optional
                  flags: unittests # optional
                  name: codecov-umbrella # optional
                  token: ${{ secrets.CODECOV_TOKEN }}
                  verbose: true # optional (default = false)
