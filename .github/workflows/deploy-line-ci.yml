# Test gate for the fork's deploy line.
#
# WHY THIS EXISTS
# Upstream's `CI` workflow (.github/workflows/python.yml) triggers only on
# `main`/`development`, and `release.yml` only on `main`. This fork does its work on
# `deploy/now-lms-fixed`, so pull requests into the deploy line ran NO tests at all --
# only the AI reviewer in `ai-code-review.yml`. A P1 defect flagged in review on PR #10
# (a percent-encoded `@` in the front-door mailto: link, which mail clients refuse)
# reached production through that gap.
#
# There is also no `development` branch on this fork, so half of python.yml's trigger is
# dead, and upstream has since DELETED python.yml entirely -- which means `release.yml`'s
# `workflow_run: workflows: ["CI"]` chain will break at the v2.0.0 sync. This workflow is
# self-contained so the deploy line keeps a gate regardless of what happens to those two.
#
# SCOPE
# Deliberately narrower than `release.yml`: one Python version and SQLite only. The point
# is a fast, reliable signal on every deploy-line PR, not full matrix coverage. Postgres
# and MySQL paths stay the responsibility of upstream's release validation on `main`.
name: Deploy line CI

on:
    pull_request:
        branches: [deploy/now-lms-fixed]
    push:
        branches: [deploy/now-lms-fixed]

permissions:
    contents: read

concurrency:
    group: deploy-line-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Tests and lint
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.7

            - name: Set up Python 3.12
              uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v4.6.0
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: python -m pip install --require-hashes -r test.lock

            - name: Compile translation catalogs
              run: pybabel compile -d now_lms/translations

            # Lint gates match dev/test.sh, which is what a contributor runs locally.
            # pylint is held at 9.5 (dev/test.sh) rather than release.yml's 9.0 so the
            # deploy line does not silently drift below the documented local standard.
            - name: Lint (ruff)
              run: python -m ruff check now_lms

            - name: Lint (flake8)
              run: python -m flake8 --max-line-length=120 --ignore=E501,E203,E266,W503,E722 now_lms

            - name: Lint (pylint)
              run: python -m pylint now_lms --score=yes --fail-under=9.5

            # ADVISORY, deliberately. dev/test.sh runs mypy but has no `set -e`, so
            # its exit code has never actually gated anything — and the codebase
            # carries 3 pre-existing mypy errors ("object" not callable, all in
            # vistas/courses/coupons.py). Blocking here would redden the deploy line
            # on findings no PR introduced. Flip to blocking once those are fixed
            # (candidate upstream contribution — they look like real typing bugs).
            - name: Typecheck (mypy — advisory until the 3 pre-existing coupons.py errors are fixed)
              continue-on-error: true
              run: python -m mypy now_lms --ignore-missing-imports

            # Tests run against REAL PostgreSQL, matching production (Postgres 16 on the
            # VPS) and release.yml's proven recipe -- the runner's built-in postgresql
            # service, same user/database setup, same pg8000 driver.
            #
            # Not SQLite, deliberately. This workflow's own first run proved that the
            # fork's conftest fails under conftest's `sqlite:///:memory:` fallback: with
            # SQLAlchemy's default pooling every new connection to an in-memory SQLite
            # database gets its OWN empty database, so the schema `initial_setup()`
            # creates is invisible to later connections and much of the suite dies with
            # `no such table: ad_sense`. (Upstream's conftest survives this; the fork's
            # rewritten one -- 47de77c -- does not.) Fixing that belongs in conftest and
            # will be moot at the v2.0.0 sync; meanwhile Postgres is the honest gate,
            # because it is what production actually runs.
            # continue-on-error is deliberate and TEMPORARY. Running the suite against
            # real PostgreSQL for the first time ever (this gate's first Postgres run,
            # 2026-07-26) surfaced ~40 pre-existing failures in two classes, neither
            # caused by any PR this gate has checked:
            #   1. SQLite-masked strictness bugs -- varchar-too-long and FK violations
            #      that SQLite tolerates and PostgreSQL rejects (e.g. programa.nombre is
            #      String(20) here; upstream has since widened it to 150).
            #   2. The fork's i18n layer changed messages to English while the inherited
            #      tests still assert the Spanish text.
            # Both classes are replaced wholesale by the v2.0.0 sync (upstream widened
            # the columns and updated the assertions), so hand-fixing ~40 tests now is
            # work the sync deletes. Until the sync lands: lint is BLOCKING, tests are
            # visible but advisory. Flip this to blocking at the sync -- tracked with the
            # deploy-integrity work in issue #14.
            # Coverage is MEASURED here, deliberately not GATED: no --cov-fail-under,
            # no Codecov upload on the deploy line. This is the first time coverage is
            # visible on the branch's real gate (dev/test.sh measures it locally, but
            # release.yml — which owns the Codecov gate — never fires here). A blocking
            # threshold in the same change as the first measurement would redden the
            # line on a number nobody has seen yet; ratcheting is a separate, deliberate
            # decision once a baseline exists (tracked with the sync work in #14).
            - name: Tests (PostgreSQL — advisory until the v2.0.0 sync repairs the suite)
              continue-on-error: true
              env:
                  CI: "True"
                  SECRET_KEY: deploy-line-ci-test-key
                  DATABASE_URL: postgresql+pg8000://lmsctl2:lmsctl2pass@127.0.0.1:5432/lmsctl2
                  FLASK_APP: now_lms
              run: |
                  sudo systemctl start postgresql.service
                  sudo -u postgres psql -c "CREATE USER lmsctl2 WITH PASSWORD 'lmsctl2pass';"
                  sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON SCHEMA public TO lmsctl2;"
                  sudo -u postgres psql -c "CREATE DATABASE lmsctl2;"
                  sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE lmsctl2 TO lmsctl2;"
                  sudo -u postgres psql -c "ALTER DATABASE lmsctl2 OWNER TO lmsctl2;"
                  sudo -u postgres psql -c "ALTER ROLE lmsctl2 CREATEDB;"
                  sudo -u postgres psql -c "GRANT USAGE ON SCHEMA public TO lmsctl2;"
                  sudo -u postgres psql -c "GRANT CREATE ON SCHEMA public TO lmsctl2;"
                  pytest --tb=short -q --cov=now_lms --cov-report=term
