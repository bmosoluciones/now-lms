# Test gate for the fork's deploy line.
#
# WHY THIS EXISTS
# Upstream's `CI` workflow (.github/workflows/python.yml) triggers only on
# `main`/`development`, and `release.yml` only on `main`. This fork does its work on
# `deploy/now-lms-fixed`, so pull requests into the deploy line ran NO tests at all --
# only the AI reviewer in `ai-code-review.yml`. A P1 defect flagged in review on PR #10
# (a percent-encoded `@` in the front-door mailto: link, which mail clients refuse)
# reached production through that gap.
#
# There is also no `development` branch on this fork, so half of python.yml's trigger is
# dead, and upstream has since DELETED python.yml entirely -- which means `release.yml`'s
# `workflow_run: workflows: ["CI"]` chain will break at the v2.0.0 sync. This workflow is
# self-contained so the deploy line keeps a gate regardless of what happens to those two.
#
# SCOPE
# Deliberately narrower than `release.yml`: one Python version and SQLite only. The point
# is a fast, reliable signal on every deploy-line PR, not full matrix coverage. Postgres
# and MySQL paths stay the responsibility of upstream's release validation on `main`.
name: Deploy line CI

on:
    pull_request:
        branches: [deploy/now-lms-fixed]
    push:
        branches: [deploy/now-lms-fixed]

permissions:
    contents: read

concurrency:
    group: deploy-line-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Tests and lint
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.7

            - name: Set up Python 3.12
              uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v4.6.0
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: python -m pip install --require-hashes -r test.lock

            - name: Compile translation catalogs
              run: pybabel compile -d now_lms/translations

            # Lint gates match dev/test.sh, which is what a contributor runs locally.
            # pylint is held at 9.5 (dev/test.sh) rather than release.yml's 9.0 so the
            # deploy line does not silently drift below the documented local standard.
            - name: Lint (ruff)
              run: python -m ruff check now_lms

            - name: Lint (flake8)
              run: python -m flake8 --max-line-length=120 --ignore=E501,E203,E266,W503,E722 now_lms

            - name: Lint (pylint)
              run: python -m pylint now_lms --score=yes --fail-under=9.5

            - name: Tests
              env:
                  CI: "True"
              run: pytest --tb=short -q
