[pytest]
# Default collection = the unit/integration suite only. The browser-E2E layer
# (e2e/) needs playwright installed and a bootable app; it runs EXPLICITLY via
# `pytest e2e/` (its own CI job) and must not break bare-`pytest` collection
# in jobs that don't install it.
testpaths = tests
addopts = -q --tb=short --disable-warnings --strict-markers
timeout = 300
timeout_method = thread
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    comprehensive: marks comprehensive tests that test many routes/scenarios
    integration: marks integration tests that require full setup
    unit: marks unit tests that run quickly
    benchmark: marks benchmark tests for performance measurement